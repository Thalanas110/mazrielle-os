[package]
name = "mazrielle-os"
version = "0.1.0"
description = "Mazrielle OS desktop vault"
authors = ["Mazrielle OS"]
edition = "2021"

[lib]
name = "mazrielle_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
zeroize = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
